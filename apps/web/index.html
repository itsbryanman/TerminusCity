<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terminus City</title><link rel="stylesheet" href="/style.css"></head>
<body><main><section class="masthead"><div><span class="eyebrow">LOCAL / LIVE / PRIVATE</span><h1>Terminus <i>City</i></h1><p id="status">Connecting to your local city…</p></div><div class="actions"><button id="pause">Pause collection</button><button id="demo" class="quiet">Simulate activity</button></div></section><section class="city-wrap"><canvas id="city" aria-label="Procedural city visualization"></canvas><aside><span class="eyebrow">CITY LEDGER</span><dl><div><dt>Commands</dt><dd id="commands">0</dd></div><div><dt>Commits</dt><dd id="commits">0</dd></div><div><dt>Incidents</dt><dd id="errors">0</dd></div><div><dt>CPU</dt><dd id="cpu">0%</dd></div></dl><p class="privacy">No raw commands or terminal output leave your machine.</p></aside></section><footer>Move your pointer across the city to shift the view. Every tower is generated from sanitized local activity.</footer></main><script type="module" src="/app.js"></script></body></html>
